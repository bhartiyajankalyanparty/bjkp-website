<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJKP Membership ID Card</title>

<link rel="stylesheet" href="style.css">


<style>

.id-card{

width:350px;
margin:30px auto;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px #999;
border:2px solid #0b7a2a;

}


.card-header{

background:#0b7a2a;
color:white;
text-align:center;
padding:15px;

}


.card-header img{

width:60px;
height:60px;
object-fit:contain;

}


.photo{

text-align:center;
margin:20px;

}


.photo img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid #ff9933;

}


.details{

padding:20px;
line-height:1.8;

}


.qr{

text-align:center;
padding:15px;

}


.qr img{

width:100px;

}


.footer-card{

background:#ff9933;
color:white;
text-align:center;
padding:10px;

}


</style>


</head>


<body>



<div class="id-card">



<div class="card-header">

<img src="image/logo.png">

<h3>
भारतीय जन कल्याण पार्टी
</h3>

<p>
सदस्यता पहचान पत्र
</p>


</div>





<div class="photo">

<img src="image/profile.jpg" id="profile">

</div>







<div class="details">


<b>नाम:</b>
<span id="cardName">---</span>

<br>


<b>सदस्य ID:</b>
<span id="cardId">---</span>

<br>


<b>मोबाइल:</b>
<span id="cardMobile">---</span>

<br>


<b>जिला:</b>
<span id="cardDistrict">---</span>

<br>


<b>राज्य:</b>
<span id="cardState">---</span>

<br>


<b>तारीख:</b>
<span id="cardDate">---</span>


</div>







<div class="qr">

<img src="image/qr.png">

<p>ID Verify</p>

</div>






<div class="footer-card">

जन सेवा • विकास • विश्वास

</div>



</div>







<script>


let data = JSON.parse(
localStorage.getItem("bjkpMember")
);



if(data){


document.getElementById("cardName").innerHTML=data.name;

document.getElementById("cardId").innerHTML=data.id;

document.getElementById("cardMobile").innerHTML=data.mobile;

document.getElementById("cardDistrict").innerHTML=data.district;

document.getElementById("cardState").innerHTML=data.state;

document.getElementById("cardDate").innerHTML=data.date;


}


else{


alert("सदस्य जानकारी नहीं मिली।");


}



</script>



</body>

</html>
