<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJKP Member ID Card</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ececec;
padding:20px;
}

.card{

width:350px;
margin:auto;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px rgba(0,0,0,.3);

}

.header{

background:#0b7a2a;
color:white;
text-align:center;
padding:15px;

}

.logo{

width:70px;
height:70px;
margin-bottom:8px;

}

.header h2{

margin-top:5px;
font-size:22px;

}

.header p{

font-size:14px;

}

.photo{

width:120px;
height:120px;
border-radius:50%;
border:4px solid orange;
display:block;
margin:18px auto;
object-fit:cover;

}

.info{

padding:18px;
line-height:1.9;
font-size:16px;

}

.info b{

color:#0b7a2a;

}

#qr{

width:90px;
height:90px;
display:block;
margin:10px auto;

}

.footer{

background:#ff9800;
color:white;
text-align:center;
padding:12px;
font-weight:bold;
line-height:1.6;

}

.buttons{

width:350px;
margin:20px auto;
display:flex;
gap:10px;

}

.buttons button{

flex:1;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
color:white;

}

.print{

background:#0b7a2a;

}

.pdf{

background:#1565c0;

}

@media print{

.buttons{
display:none;
}

body{
background:white;
}

}
</style>

</head>

<body>

<div class="card" id="card">

<div class="header">

<img src="image/logo.png" class="logo">

<h2>भारतीय जन कल्याण पार्टी</h2>

<p>Official Member Identity Card</p>

</div>

<img id="photo" class="photo">

<div class="info">

<p><b>नाम :</b> <span id="name"></span></p>

<p><b>Member ID :</b> <span id="memberId"></span></p>

<p><b>मोबाइल :</b> <span id="mobile"></span></p>

<p><b>ईमेल :</b> <span id="email"></span></p>

<p><b>पता :</b> <span id="address"></span></p>

<p><b>Status :</b> <span style="color:green;">✅ Active</span></p>

<p><b>Join Date :</b> <span id="joinDate"></span></p>

</div>

<img id="qr">

<div class="footer">

भारतीय जन कल्याण पार्टी

<br>

राष्ट्रीय अध्यक्ष

<br>

अजीत कुमार चौधरी

</div>

</div>

<div class="buttons">

<button class="print" onclick="window.print()">

🖨 Print

</button>

<button class="pdf" onclick="downloadPDF()">

📥 PDF

</button>

</div>

<script type="module" src="idcard.js"></script>

</body>
</html>
