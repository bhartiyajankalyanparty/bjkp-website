<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BJKP Member ID Card</title>

<style>

body{
margin:0;
background:#ececec;
font-family:Arial,sans-serif;
}

.card{

width:340px;

margin:30px auto;

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 0 15px rgba(0,0,0,.3);

}

.header{

background:#0b7a2a;

color:white;

text-align:center;

padding:15px;

}

.logo{

width:70px;

height:70px;

margin-bottom:8px;

}

.photo{

width:120px;

height:120px;

border-radius:50%;

border:4px solid orange;

display:block;

margin:15px auto;

object-fit:cover;

}

.info{

padding:15px;

font-size:16px;

line-height:1.8;

}

.info b{

color:#0b7a2a;

}

.footer{

background:#ff9800;

color:white;

text-align:center;

padding:10px;

font-weight:bold;

}

.print{

display:block;

margin:20px auto;

padding:12px 25px;

background:#0b7a2a;

color:white;

border:none;

border-radius:6px;

font-size:16px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card">

<div class="header">

<img src="image/logo.png" class="logo">

<h2>भारतीय जन कल्याण पार्टी</h2>

<p>Official Member ID Card</p>

</div>

<img id="photo" class="photo">

<div class="info">

<p><b>नाम :</b> <span id="name"></span></p>

<p><b>Member ID :</b> <span id="memberId"></span></p>

<p><b>मोबाइल :</b> <span id="mobile"></span></p>

<p><b>पता :</b> <span id="address"></span></p>

<p><b>Status :</b> Active ✅</p>

</div>

<div class="footer">

Bhartiya Jan Kalyan Party

</div>

</div>

<button class="print" onclick="window.print()">

🖨 Print ID Card

</button>

<script>

const m=JSON.parse(localStorage.getItem("member"));

document.getElementById("photo").src=m.photo;

document.getElementById("name").innerText=m.name;

document.getElementById("memberId").innerText=m.memberId;

document.getElementById("mobile").innerText=m.mobile;

document.getElementById("address").innerText=m.address;

</script>

</body>
</html>
