<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJKP Member ID Card</title>

<link rel="stylesheet" href="idcard.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>

<body>

<div class="id-container">

<div class="id-card" id="card">

<div class="card-header">

<img src="image/logo.png" class="logo">

<div>

<h2>भारतीय जन कल्याण पार्टी</h2>

<p>Official Member Identity Card</p>

</div>

</div>

<div class="photo-box">

<img id="photo" src="image/president.jpg">

</div>

<div class="member-info">

<h3 id="name">नाम</h3>

<p><b>Member ID :</b> <span id="memberId"></span></p>

<p><b>मोबाइल :</b> <span id="mobile"></span></p>

<p><b>ईमेल :</b> <span id="email"></span></p>

<p><b>पता :</b> <span id="address"></span></p>

<p><b>स्थिति :</b>

<span id="status" style="color:green;">

✅ Active

</span>

</p>

<p><b>Join Date :</b>

<span id="joinDate"></span>

</p>

<div class="qr-section">

<img id="qr" src="">

<p>

Scan to Verify

</p>

</div>

<div class="signature">

<div>

<p>__________________</p>

<b>राष्ट्रीय अध्यक्ष</b>

</div>

<div>

<p>__________________</p>

<b>सदस्य हस्ताक्षर</b>

</div>

</div>

<div class="card-footer">

<p>

"जनता का विश्वास • राष्ट्र का विकास"

</p>

</div>

</div>

<div class="card-buttons">

<button onclick="window.print()">

🖨 Print

</button>

<button onclick="downloadPDF()">

📄 Download PDF

</button>

</div>

</div>

<script type="module" src="idcard.js"></script>

<script>

function downloadPDF(){

const element=document.getElementById("card");

html2pdf().set({

margin:0.3,

filename:

document.getElementById("memberId").innerText +

"_BJKP_ID.pdf",

image:{

type:"jpeg",

quality:1

},

html2canvas:{

scale:2

},

jsPDF:{

unit:"in",

format:"a4",

orientation:"portrait"

}

}).from(element).save();

}

</script>

</body>

</html>
