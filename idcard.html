<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJKP Member ID Card</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
display:flex;
justify-content:center;
padding:20px;
}

.card{
width:350px;
background:white;
border:3px solid #ff6600;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.3);
overflow:hidden;
}

.header{
background:#ff6600;
color:white;
text-align:center;
padding:15px;
}

.logo{
width:90px;
height:90px;
border-radius:50%;
margin-top:10px;
}

.content{
padding:20px;
}

.content p{
font-size:16px;
margin:10px 0;
}

.btn{
text-align:center;
padding:20px;
}

button{
padding:12px 25px;
background:#008000;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}
</style>

</head>

<body>

<div class="card">

<div class="header">

<img src="image/logo.png" class="logo">

<h2>भारतीय जन कल्याण पार्टी</h2>

<p>MEMBERSHIP ID CARD</p>

</div>

<div class="content">

<p><b>🆔 Member ID:</b> <span id="memberId"></span></p>

<p><b>👤 नाम:</b> <span id="name"></span></p>

<p><b>📱 मोबाइल:</b> <span id="mobile"></span></p>

<p><b>📍 पता:</b> <span id="address"></span></p>

</div>

<div class="btn">

<button onclick="window.print()">🖨️ Print ID Card</button>

</div>

</div>

<script>

const data = JSON.parse(localStorage.getItem("member"));

if(data){

document.getElementById("memberId").innerText=data.memberId;

document.getElementById("name").innerText=data.name;

document.getElementById("mobile").innerText=data.mobile;

document.getElementById("address").innerText=data.address;

}

</script>

</body>
</html>
