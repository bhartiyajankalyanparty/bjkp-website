<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Member ID Card</title>

<style>

body{
background:#f2f2f2;
font-family:Arial;
}

.card{

width:350px;

margin:30px auto;

background:white;

border:3px solid #0b7a2a;

border-radius:15px;

padding:20px;

text-align:center;

}

img{

width:120px;

height:120px;

border-radius:50%;

border:3px solid orange;

object-fit:cover;

}

h2{
color:#0b7a2a;
margin:10px;
}

button{

margin-top:20px;

padding:10px 20px;

background:#0b7a2a;

color:white;

border:none;

border-radius:6px;

}

</style>

</head>

<body>

<div class="card">

<h2>भारतीय जन कल्याण पार्टी</h2>

<img id="photo">

<h3 id="name"></h3>

<p id="memberId"></p>

<p id="mobile"></p>

<p id="address"></p>

<button onclick="window.print()">

🖨 Print ID Card

</button>

</div>

<script>

const member=JSON.parse(localStorage.getItem("member"));

document.getElementById("photo").src=member.photo;

document.getElementById("name").innerText=member.name;

document.getElementById("memberId").innerText="ID : "+member.memberId;

document.getElementById("mobile").innerText=member.mobile;

document.getElementById("address").innerText=member.address;

</script>

</body>
</html>
