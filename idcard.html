<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJKP Membership ID Card</title>

<link rel="stylesheet" href="style.css">

<style>

.id-card{

width:350px;
margin:30px auto;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px #999;
border:2px solid #0b7a2a;

}


.card-header{

background:#0b7a2a;
color:white;
text-align:center;
padding:15px;

}


.card-header img{

width:60px;
height:60px;
object-fit:contain;

}



.photo{

text-align:center;
margin:20px;

}


.photo img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid #ff9933;

}



.details{

padding:20px;
line-height:1.8;

}



.qr{

text-align:center;
padding:15px;

}



.qr img{

width:100px;

}



.footer-card{

background:#ff9933;
color:white;
text-align:center;
padding:10px;

}

</style>


</head>


<body>


<div class="id-card">


<div class="card-header">


<img src="image/logo.png">

</div>





<div class="details">


<b>नाम:</b> सदस्य का नाम

<br>

<b>मोबाइल:</b> 9876543210

<br>

<b>जिला:</b> आपका जिला

<br>

<b>तिथि:</b> 05-08-2026


</div>





<div class="qr">

</div>






<div class="footer-card">

जन सेवा • विकास • विश्वास

</div>


</div>


</body>

</html>
