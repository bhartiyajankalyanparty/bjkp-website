<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ऑनलाइन सदस्यता | भारतीय जन कल्याण पार्टी</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="member-header">
<img src="image/logo.png" class="member-logo" alt="Logo">

<h1>भारतीय जन कल्याण पार्टी</h1>

<p>ऑनलाइन सदस्यता फॉर्म</p>

</header>

<div class="member-container">

<h2>👥 सदस्य बनें</h2>

<p>कृपया नीचे दी गई जानकारी सही-सही भरें।</p>

<form id="memberForm">

<input type="text" id="name" placeholder="पूरा नाम" required>

<input type="tel" id="mobile" placeholder="मोबाइल नंबर" required>

<input type="email" id="email" placeholder="ईमेल">

<textarea id="address" placeholder="पूरा पता"></textarea>

<label>📷 पासपोर्ट साइज फोटो</label>

<input type="file" id="photo" accept="image/*">

<select id="gender">
<option value="">लिंग चुनें</option>
<option value="पुरुष">पुरुष</option>
<option value="महिला">महिला</option>
<option value="अन्य">अन्य</option>
</select>

<input type="date" id="dob">

<input type="text" id="occupation" placeholder="व्यवसाय">

<input type="text" id="district" placeholder="जिला">

<input type="text" id="state" placeholder="राज्य">

<div class="declaration">

<label>

<input type="checkbox" id="agree" required>

मैं घोषणा करता/करती हूँ कि मेरे द्वारा दी गई सभी जानकारी सही है तथा मैं भारतीय जन कल्याण पार्टी के नियमों का पालन करूँगा/करूँगी।

</label>

</div>

<div class="form-buttons">

<button type="reset" class="resetBtn">

🔄 रीसेट

</button>

<button type="button" id="submitBtn" class="submitBtn">

🚀 सदस्यता भेजें

</button>

</div>

</form>

</div>

<footer class="member-footer">

<img src="image/logo.png" class="footer-logo" alt="Logo">

<h3>भारतीय जन कल्याण पार्टी</h3>

<p>राष्ट्रहित • जनहित • विकास</p>

</div>

</p>

</footer>

</body>

</html>
