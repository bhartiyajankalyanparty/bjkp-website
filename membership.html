<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ऑनलाइन सदस्यता</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:500px;
margin:30px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#ff6600;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e65c00;
}

</style>

</head>


<body>


<header>

<h1>भारतीय जन कल्याण पार्टी</h1>

<p>ऑनलाइन सदस्यता फॉर्म</p>

</header>



<div class="container">


<h2>सदस्य बनें</h2>


<input type="text" id="name" placeholder="पूरा नाम">


<input type="tel" id="mobile" placeholder="मोबाइल नंबर">


<input type="email" id="email" placeholder="ईमेल">


<label>📷 पासपोर्ट साइज फोटो</label>

<input type="file" id="photo" accept="image/*">


<textarea id="address" placeholder="पूरा पता"></textarea>



<button id="submitBtn">
सदस्यता भेजें
</button>


</div>




<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";





const firebaseConfig={

apiKey:"AIzaSyBGa257kKYT4zJcUSyeu7aITZ0Y3D6AYk0",

authDomain:"bhartiya-jan-kalyan-party-org.firebaseapp.com",

projectId:"bhartiya-jan-kalyan-party-org",

storageBucket:"bhartiya-jan-kalyan-party-org.firebasestorage.app",

messagingSenderId:"715864126578",

appId:"1:715864126578:web:9f9901e4c2a119b225beeb"

};




const app=initializeApp(firebaseConfig);

const db=getFirestore(app);





document.getElementById("submitBtn").addEventListener("click",async()=>{


const name=document.getElementById("name").value.trim();

const mobile=document.getElementById("mobile").value.trim();

const email=document.getElementById("email").value.trim();

const address=document.getElementById("address").value.trim();

const photoInput=document.getElementById("photo");




if(name=="" || mobile==""){

alert("नाम और मोबाइल नंबर भरें");

return;

}




try{


const snapshot=await getDocs(collection(db,"members"));


const memberId="BJKP"+String(snapshot.size+1).padStart(4,"0");



let photo="image/president.jpg";



if(photoInput.files.length>0){


const reader=new FileReader();


reader.onload=async function(e){


await saveMember(e.target.result);


};


reader.readAsDataURL(photoInput.files[0]);


}

else{


await saveMember(photo);


}




async function saveMember(photo){


await addDoc(collection(db,"members"),{


memberId:memberId,

name:name,

mobile:mobile,

email:email,

address:address,

photo:photo,

status:"Active",

joinDate:new Date().toLocaleDateString("hi-IN"),

date:new Date()


});



localStorage.setItem("member",JSON.stringify({


memberId,

name,

mobile,

email,

address,

photo


}));




alert("✅ सदस्यता सफल!\n\nMember ID : "+memberId);



alert("Redirect: idcard.html?id=" + memberId);
window.location.href = "idcard.html?id=" + memberId;



}



}

catch(error){


console.log(error);


alert("डेटा सेव नहीं हुआ");


}



});



window.onerror = function(msg){
  alert("Error: " + msg);
};

console.log("Membership JS Loaded");
</script>


</body>

</html>
