<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ऑनलाइन सदस्यता</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
max-width:500px;
margin:30px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}
button{
width:100%;
padding:14px;
background:#ff6600;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#e65c00;
}
</style>

</head>
<body>

<header>
<h1>भारतीय जन कल्याण पार्टी</h1>
<p>ऑनलाइन सदस्यता फॉर्म</p>
</header>

<div class="container">

<h2>सदस्य बनें</h2>

<input type="text" id="name" placeholder="पूरा नाम" required>

<input type="tel" id="mobile" placeholder="मोबाइल नंबर" required>

<input type="email" id="email" placeholder="ईमेल">

<label>अपनी फोटो चुनें</label>
<input type="file" id="photo" accept="image/*">

<textarea id="address" placeholder="पूरा पता"></textarea>

<button id="submitBtn">सदस्यता भेजें</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGa257kKYT4zJcUSyeu7aITZ0Y3D6AYk0",
  authDomain: "bhartiya-jan-kalyan-party-org.firebaseapp.com",
  projectId: "bhartiya-jan-kalyan-party-org",
  storageBucket: "bhartiya-jan-kalyan-party-org.firebasestorage.app",
  messagingSenderId: "715864126578",
  appId: "1:715864126578:web:9f9901e4c2a119b225beeb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("submitBtn").addEventListener("click", async()=>{

const name=document.getElementById("name").value;
const mobile=document.getElementById("mobile").value;
const email=document.getElementById("email").value;
const address=document.getElementById("address").value;

if(name==""||mobile==""){
alert("नाम और मोबाइल नंबर भरें");
return;
}

try{

await addDoc(collection(db,"members"),{
name,
mobile,
email,
address,
date:new Date()
});

alert("सदस्यता सफलतापूर्वक दर्ज हो गई");

document.getElementById("name").value="";
document.getElementById("mobile").value="";
document.getElementById("email").value="";
document.getElementById("address").value="";

}catch(e){

alert("डेटा सेव नहीं हुआ");

}

});

</script>

</body>
</html>
