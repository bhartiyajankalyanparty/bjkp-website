<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | BJKP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">

<img src="image/logo.png">

<h1>BJKP Admin Panel</h1>

</div>

</header>





<section class="section" id="loginBox">


<h2>Admin Login</h2>


<input type="text" id="adminUser" placeholder="Username">


<input type="password" id="adminPass" placeholder="Password">


<button class="join-btn" onclick="adminLogin()">

Login

</button>


</section>








<section class="section" id="dashboard" style="display:none;">


<h2>Dashboard</h2>



<div class="cards">


<div class="card">

<h3>Total Members</h3>

<p id="totalMembers">0</p>

</div>



<div class="card">

<h3>Total News</h3>

<p id="totalNews">0</p>

</div>



</div>






<h2>Members List</h2>


<div id="memberList">

Loading...

</div>



</section>







<script src="admin.js"></script>


</body>

</html>
