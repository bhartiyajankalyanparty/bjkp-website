<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.card-box{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
margin-bottom:20px;
}

.card{
width:180px;
padding:20px;
border-radius:10px;
color:white;
text-align:center;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
padding:12px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.section{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
</style>

</head>

<body>

<div class="container">

<button id="logoutBtn" style="float:right;background:red;color:white;">
🚪 Logout
</button>

<h1 style="text-align:center;">भारतीय जन कल्याण पार्टी</h1>

<h2 style="text-align:center;">Admin Dashboard</h2>

<div class="card-box">

<div class="card" style="background:#0b7a2a;">
<h2 id="totalMembers">0</h2>
<p>कुल सदस्य</p>
</div>

<div class="card" style="background:#ff9800;">
<h2 id="totalNews">0</h2>
<p>कुल समाचार</p>
</div>

<div class="card" style="background:#2196f3;">
<h2 id="todayMembers">0</h2>
<p>आज जुड़े सदस्य</p>
</div>

</div>

<div class="section">

<h2>🔍 सदस्य खोजें</h2>

<input
type="text"
id="searchMember"
placeholder="नाम या मोबाइल नंबर लिखें">

</div>

<div class="section">

<h2>✏️ सदस्य संपादित करें</h2>

<input type="hidden" id="editId">

<input
type="text"
id="editName"
placeholder="पूरा नाम">

<input
type="text"
id="editMobile"
placeholder="मोबाइल नंबर">

<input
type="email"
id="editEmail"
placeholder="ईमेल">

<textarea
id="editAddress"
placeholder="पूरा पता"></textarea>

<button
id="updateMemberBtn"
style="background:#0b7a2a;color:white;width:100%;">
💾 सदस्य अपडेट करें
</button>

</div>

<div class="section">

<h2>👥 सदस्यों की सूची</h2>

<div id="memberList"></div>

</div>

<div class="section">

<h2>📰 नई खबर जोड़ें</h2>

<input
type="text"
id="newsTitle"
placeholder="समाचार का शीर्षक">

<textarea
id="newsDescription"
placeholder="समाचार का विवरण"></textarea>

<button
id="addNewsBtn"
style="background:#ff9800;color:white;width:100%;">
समाचार जोड़ें
</button>

</div>

<div class="section">

<h2>📢 नई सूचना जोड़ें</h2>

<input
type="text"
id="noticeTitle"
placeholder="सूचना का शीर्षक">

<input
type="text"
id="noticeDate"
placeholder="तारीख">

<button
id="addNoticeBtn"
style="background:#0b7a2a;color:white;width:100%;">
सूचना जोड़ें
</button>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
