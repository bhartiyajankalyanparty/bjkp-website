<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJKP Admin Panel V2</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="sidebar">

<div class="logo">

<img src="image/logo.png" alt="Logo">

<h2>BJKP Admin</h2>

</div>

<ul>

<li class="active">🏠 Dashboard</li>

<li>👥 Members</li>

<li>📰 News</li>

<li>📢 Notice</li>

<li>🪪 Verify</li>

<li>⚙️ Settings</li>

<li id="logoutBtn">🚪 Logout</li>

</ul>

</div>

<div class="main">

<header>

<h1>भारतीय जन कल्याण पार्टी</h1>

<p>Admin Dashboard V2</p>

</header>

<div class="dashboard">

<div class="card green">

<h2 id="totalMembers">0</h2>

<p>Total Members</p>

</div>

<div class="card blue">

<h2 id="activeMembers">0</h2>

<p>Active Members</p>

</div>

<div class="card orange">

<h2 id="totalNews">0</h2>

<p>Total News</p>

</div>

<div class="card red">

<h2 id="todayMembers">0</h2>

<p>Today's Join</p>

</div>

</div>

<section class="panel">

<h2>🔍 Member Search</h2>

<input
type="text"
id="searchMember"
placeholder="नाम, मोबाइल या Member ID खोजें">

</section>

<section class="panel">

<h2>👥 Member List</h2>

<div id="memberList"></div>

</section>

<section class="panel">

<h2>✏️ Edit Member</h2>

<input type="hidden" id="editId">

<input type="text" id="editName" placeholder="पूरा नाम">

<input type="text" id="editMobile" placeholder="मोबाइल नंबर">

<input type="email" id="editEmail" placeholder="ईमेल">

<textarea id="editAddress" placeholder="पूरा पता"></textarea>

<select id="editStatus">
<option value="Active">✅ Active</option>
<option value="Inactive">❌ Inactive</option>
</select>

<button id="updateMemberBtn" class="btn green">
💾 Update Member
</button>

</section>

<section class="panel">

<h2>📰 Add News</h2>

<input type="text" id="newsTitle" placeholder="समाचार का शीर्षक">

<textarea id="newsDescription" placeholder="समाचार का विवरण"></textarea>

<button id="addNewsBtn" class="btn orange">
📰 Add News
</button>

</section>

<section class="panel">

<h2>📢 Add Notice</h2>

<input type="text" id="noticeTitle" placeholder="सूचना">

<input type="date" id="noticeDate">

<button id="addNoticeBtn" class="btn blue">
📢 Add Notice
</button>

</section>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
