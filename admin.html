<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 style="text-align:center;">भारतीय जन कल्याण पार्टी</h1>
<h2 style="text-align:center;">Admin Panel</h2>
  <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin:20px;">

<div style="background:#0b7a2a;color:white;padding:20px;border-radius:10px;width:180px;text-align:center;">
<h2 id="totalMembers">0</h2>
<p>कुल सदस्य</p>
</div>

<div style="background:#ff9800;color:white;padding:20px;border-radius:10px;width:180px;text-align:center;">
<h2 id="totalNews">0</h2>
<p>कुल समाचार</p>
</div>

<div style="background:#2196f3;color:white;padding:20px;border-radius:10px;width:180px;text-align:center;">
<h2 id="todayMembers">0</h2>
<p>आज जुड़े सदस्य</p>
</div>

  </div>

<div id="memberList" style="max-width:800px;margin:auto;"></div>

<h2>नई खबर जोड़ें</h2>

<h2>📢 नई सूचना जोड़ें</h2>

<input type="text" id="noticeTitle" placeholder="सूचना का शीर्षक">

<input type="text" id="noticeDate" placeholder="तारीख (जैसे 31 जुलाई 2026)">

<button id="addNoticeBtn">सूचना जोड़ें</button>

<input type="text" id="newsTitle" placeholder="समाचार का शीर्षक">

<textarea id="newsDescription" placeholder="समाचार का विवरण"></textarea>

<button id="addNewsBtn">समाचार जोड़ें</button>

<script type="module" src="admin.js"></script>

</body>
</html>
