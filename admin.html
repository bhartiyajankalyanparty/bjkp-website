<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Admin Dashboard | भारतीय जन कल्याण पार्टी
</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="admin-container">

<header class="admin-header">

<div class="logo-box">

<img src="image/logo.png">

<div>

<h2>
भारतीय जन कल्याण पार्टी
</h2>

<p>
Admin Dashboard
</p>

</div>

</div>

<button
id="logoutBtn"
class="logout-btn">

🚪 Logout

</button>

</header>

<section class="dashboard-cards">

<div class="dashboard-card">

<h3>Total Members</h3>

<h1 id="memberCount">0</h1>

</div>

<div class="dashboard-card">

<h3>Total News</h3>

<h1 id="newsCount">0</h1>

</div>

<div class="dashboard-card">

<h3>Total Notice</h3>

<h1 id="noticeCount">0</h1>

</div>

</section>

<section class="admin-section">

<h2>

➕ नया समाचार

</h2>

<input
id="newsTitle"
placeholder="समाचार शीर्षक">

<textarea
id="newsDescription"
placeholder="समाचार विवरण">

</textarea>

<button
id="addNewsBtn"
class="btn">

समाचार जोड़ें

</button>

</section>

<section class="admin-section">

<h2>

📢 नई सूचना

</h2>

<input
id="noticeTitle"
placeholder="सूचना शीर्षक">

<textarea
id="noticeDescription"
placeholder="सूचना विवरण">

</textarea>

<button
id="addNoticeBtn"
class="btn">

सूचना जोड़ें

</button>

</section>

<section class="admin-section">

<h2>

🔍 सदस्य खोजें

</h2>

<input
type="text"
id="searchMember"
placeholder="Member ID / नाम / मोबाइल">

</section>

<section class="admin-section">

<h2>

👥 सभी सदस्य

</h2>

<div
id="memberList"
class="member-grid">

</div>

</section>

<section class="admin-section">

<h2>

📰 सभी समाचार

</h2>

<div
id="newsList"
class="member-grid">

</div>

</section>

<section class="admin-section">

<h2>

📢 सभी सूचनाएँ

</h2>

<div
id="noticeList"
class="member-grid">

</div>

</section>

<section class="admin-section admin-actions">

<button
id="refreshBtn"
class="btn">

🔄 Refresh

</button>

<button
id="exportBtn"
class="btn">

📥 Export Members

</button>

</section>

<footer class="member-footer">

<img
src="image/logo.png"
class="footer-logo"
alt="BJKP Logo">

<h3>

भारतीय जन कल्याण पार्टी

</h3>

<p>

Admin Management System

</p>

<p class="copyright">

© 2026 भारतीय जन कल्याण पार्टी

<br>

All Rights Reserved

</p>

</footer>

</div>

<script type="module" src="auth.js"></script>

<script type="module" src="admin.js"></script>

</body>

</html>
