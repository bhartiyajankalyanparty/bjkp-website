<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Verification</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
text-align:center;
padding:20px;
}

.box{
max-width:400px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0b7a2a;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

img{
width:120px;
height:120px;
border-radius:50%;
margin-top:15px;
object-fit:cover;
border:3px solid orange;
}

#result{
margin-top:20px;
text-align:left;
}
</style>
</head>

<body>

<div class="box">

<h2>सदस्य सत्यापन</h2>

<input
type="text"
id="memberId"
placeholder="Member ID डालें">

<button onclick="verifyMember()">
Verify Member
</button>

<div id="result"></div>

</div>

<script type="module" src="verify.js"></script>

</body>
</html>
