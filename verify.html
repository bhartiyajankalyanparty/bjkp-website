<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Verification</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
max-width:500px;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0b7a2a;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

#result{
margin-top:20px;
}

img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid orange;
}

</style>

</head>

<body>

<header>
<h1>Member Verification</h1>
</header>

<div class="container">

<input
type="text"
id="memberId"
placeholder="Member ID (BJKP0001)">

<button id="verifyBtn">
Verify Member
</button>

<div id="result"></div>

</div>

<script type="module" src="verify.js"></script>

</body>
</html>
