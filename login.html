<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div style="max-width:400px;margin:60px auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 0 10px #ccc;">

<h2 style="text-align:center;">Admin Login</h2>

<input type="email"
id="email"
placeholder="Email"
style="width:100%;padding:10px;margin:10px 0;">

<input type="password"
id="password"
placeholder="Password"
style="width:100%;padding:10px;margin:10px 0;">

<button
id="loginBtn"
style="width:100%;padding:12px;background:green;color:white;border:none;border-radius:5px;">
Login
</button>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
