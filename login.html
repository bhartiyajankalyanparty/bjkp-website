<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | भारतीय जन कल्याण पार्टी</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-container">

<div class="login-box">

<img src="image/logo.png" class="login-logo" alt="Logo">

<h2>Admin Login</h2>

<p>भारतीय जन कल्याण पार्टी</p>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button
id="loginBtn">

🔐 Login

</button>

<p id="loginMessage"></p>

</div>

</div>

<footer class="member-footer">

<img
src="image/logo.png"
class="footer-logo"
alt="Logo">

<h3>

भारतीय जन कल्याण पार्टी

</h3>

<p>

Admin Authentication System

</p>

<p class="copyright">

© 2026 भारतीय जन कल्याण पार्टी

<br>

All Rights Reserved

</p>

</footer>

</html>
